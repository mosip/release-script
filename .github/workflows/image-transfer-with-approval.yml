name: Manual workflow to transfer images (with approval)

# OPTIONAL cutover workflow — do not replace image-transfer.yml until Environments exist.
#
# Valid pattern: a normal runner job with `environment:` waits for Approve,
# THEN the reusable kattu workflow runs. (`environment` is NOT allowed on a
# job that uses `uses:` — see GitHub reusable workflow rules / actionlint.)
#
# Token source (compatible with today): existing repository secrets
#   MOSIPDEV2_DOCKER_TOKEN, MOSIPQA_DOCKER_TOKEN, etc.
# Later (Approach A): move those values to Environment secrets and update kattu
# so the gated job can read Environment-scoped tokens in the same job.
#
# Setup: release/docs/image-transfer-approval-single-workflow.md
# Cutover: release/docs/image-transfer-cutover-checklist.md

on:
  workflow_dispatch:
    inputs:
      TRANSFER_TARGET:
        description: 'Stage gate (GitHub Environment name). Destination org is derived.'
        required: true
        type: choice
        default: 'transfer-dev2'
        options:
          - transfer-dev2
          - transfer-qa
          - transfer-mosipint
          - transfer-mosipid
          - transfer-injistack-dev2
          - transfer-injistack-qa
          - transfer-injistack
      USERNAME:
        description: 'Registry username (Docker Hub user or Harbor robot)'
        required: true
        default: ''
        type: string
      REGISTRY_URL:
        description: 'Destination registry URL'
        required: true
        default: 'https://index.docker.io/v1/'
        type: string
      REGISTRY_TYPE:
        description: 'Destination registry type'
        required: true
        default: 'dockerhub'
        type: choice
        options:
          - dockerhub
          - harbor
          - other
      ENABLE_WIREGUARD:
        description: 'Enable WireGuard VPN (required for private Harbor networks)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Human approval gate (supported: environment on a normal job).
  approve:
    runs-on: ubuntu-latest
    environment: ${{ inputs.TRANSFER_TARGET }}
    steps:
      - name: Record approved target
        env:
          TARGET: ${{ inputs.TRANSFER_TARGET }}
        run: |
          printf 'Approved TRANSFER_TARGET=%s\n' "$TARGET"

  resolve-target:
    needs: approve
    runs-on: ubuntu-latest
    outputs:
      DESTINATION_ORGANIZATION: ${{ steps.map.outputs.DESTINATION_ORGANIZATION }}
      TOKEN_SECRET: ${{ steps.map.outputs.TOKEN_SECRET }}
    steps:
      - name: Map TRANSFER_TARGET to destination org and existing secret name
        id: map
        env:
          TARGET: ${{ inputs.TRANSFER_TARGET }}
          REGISTRY_TYPE: ${{ inputs.REGISTRY_TYPE }}
          REGISTRY_URL: ${{ inputs.REGISTRY_URL }}
        run: |
          case "$TARGET" in
            transfer-dev2)
              DEST="mosipdev2"
              TOKEN_SECRET="MOSIPDEV2_DOCKER_TOKEN"
              ;;
            transfer-qa)
              DEST="mosipqa"
              TOKEN_SECRET="MOSIPQA_DOCKER_TOKEN"
              ;;
            transfer-mosipint)
              DEST="mosipint"
              TOKEN_SECRET="MOSIPINT_DOCKER_TOKEN"
              ;;
            transfer-mosipid)
              DEST="mosipid"
              TOKEN_SECRET="MOSIPID_DOCKER_TOKEN"
              ;;
            transfer-injistack-dev2|transfer-injistack-qa|transfer-injistack)
              case "$TARGET" in
                transfer-injistack-dev2) DEST="injistackdev2" ;;
                transfer-injistack-qa)   DEST="injistackqa" ;;
                transfer-injistack)      DEST="injistack" ;;
              esac
              TOKEN_SECRET="INJISTACK_DOCKER_TOKEN"
              ;;
            *)
              printf '❌ Unknown TRANSFER_TARGET: %s\n' "$TARGET" >&2
              exit 1
              ;;
          esac

          # Default path is Docker Hub. Harbor/other remain allowed but are explicit.
          if [ "$REGISTRY_TYPE" = "dockerhub" ] && [ "$REGISTRY_URL" != "https://index.docker.io/v1/" ]; then
            printf '❌ REGISTRY_URL must be https://index.docker.io/v1/ when REGISTRY_TYPE=dockerhub\n' >&2
            exit 1
          fi

          printf 'TRANSFER_TARGET=%s DEST=%s TOKEN_SECRET=%s\n' "$TARGET" "$DEST" "$TOKEN_SECRET"
          printf 'DESTINATION_ORGANIZATION=%s\n' "$DEST" >> "$GITHUB_OUTPUT"
          printf 'TOKEN_SECRET=%s\n' "$TOKEN_SECRET" >> "$GITHUB_OUTPUT"

      - name: Validate repository secret exists
        env:
          TOKEN_EXISTS: ${{ secrets[steps.map.outputs.TOKEN_SECRET] != '' }}
          SECRET_NAME: ${{ steps.map.outputs.TOKEN_SECRET }}
        run: |
          if [ "$TOKEN_EXISTS" != "true" ]; then
            printf '❌ Repository secret %s is missing or empty\n' "$SECRET_NAME" >&2
            printf 'Use the same MOSIP*_DOCKER_TOKEN / INJISTACK_DOCKER_TOKEN secrets as today.\n' >&2
            exit 1
          fi
          printf '✅ Secret %s is configured\n' "$SECRET_NAME"

  Image-transfer:
    needs: resolve-target
    uses: mosip/kattu/.github/workflows/image-transfer.yml@master
    with:
      DESTINATION_ORGANIZATION: ${{ needs.resolve-target.outputs.DESTINATION_ORGANIZATION }}
      REGISTRY_URL: ${{ inputs.REGISTRY_URL }}
      REGISTRY_TYPE: ${{ inputs.REGISTRY_TYPE }}
      ENABLE_WIREGUARD: ${{ inputs.ENABLE_WIREGUARD }}
      USERNAME: ${{ inputs.USERNAME }}
    secrets:
      TOKEN: ${{ secrets[needs.resolve-target.outputs.TOKEN_SECRET] }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEVOPS }}
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
