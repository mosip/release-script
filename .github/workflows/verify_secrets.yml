name: Verify GitHub Secrets

on:
  push:
    branches:
      - release-1.2.0.1
  pull_request:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Echo secrets
      run: |
        OSSRH_USER1 = ${OSSRH_USER}
        OSSRH_SECRET1 = ${OSSRH_SECRET}
        OSSRH_TOKEN1 = ${OSSRH_TOKEN}
        OSSRH_SNAPSHOT_URL1 = ${OSSRH_SNAPSHOT_URL}
        GPG_SECRET1 = ${GPG_SECRET}
        
        echo ${OSSRH_SNAPSHOT_URL1}
        echo ${OSSRH_USER1}
        echo ${OSSRH_SECRET1}
        echo ${OSSRH_TOKEN}
        echo ${GPG_SECRET}
      env:
        OSSRH_SNAPSHOT_URL: ${{ secrets.OSSRH_SNAPSHOT_URL }}
        OSSRH_USER: ${{ secrets.OSSRH_USER }}
        OSSRH_SECRET: ${{ secrets.OSSRH_SECRET }}
        OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        GPG_SECRET: ${{ secrets.GPG_SECRET }}
