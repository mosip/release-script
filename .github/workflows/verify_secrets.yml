name: Verify GitHub Secrets
on:
  push:
    branches:
      - release-1.2.0.1
  pull_request:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Echo secrets (redacted)
      run: |
        echo ${OSSRH_SNAPSHOT_URL1} >> a.txt
        echo ${OSSRH_USER1} >> a.txt
        echo ${OSSRH_SECRET1} >> a.txt
        echo ${OSSRH_TOKEN1} >> a.txt
        echo ${GPG_SECRET1} >> a.txt
        cat a.txt
      env:
        OSSRH_SNAPSHOT_URL1: ${{ secrets.OSSRH_SNAPSHOT_URL }}
        OSSRH_USER1: ${{ secrets.OSSRH_USER }}
        OSSRH_SECRET1: ${{ secrets.OSSRH_SECRET }}
        OSSRH_TOKEN1: ${{ secrets.OSSRH_TOKEN }}
        GPG_SECRET1: ${{ secrets.OSSRH_SECRET }}
