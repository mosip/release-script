name: Verify GitHub Secrets

on:
  push:
    branches:
      - release-1.2.0.1
  pull_request:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Echo secrets (redacted)
      run: |
        echo "OSSRH_SNAPSHOT_URL1: ${OSSRH_SNAPSHOT_URL1:0:4}****" >> a.txt
        echo "OSSRH_USER1: ${OSSRH_USER1}" >> a.txt
        echo "OSSRH_SECRET1: ${OSSRH_SECRET1:0:4}****" >> a.txt
        echo "OSSRH_TOKEN1: ${OSSRH_TOKEN1:0:4}****" >> a.txt
        echo "GPG_SECRET1: ${GPG_SECRET1:0:4}****" >> a.txt
        cat a.txt
      env:
        OSSRH_SNAPSHOT_URL1: ${{ secrets.OSSRH_SNAPSHOT_URL }}
        OSSRH_USER1: ${{ secrets.OSSRH_USER }}
        OSSRH_SECRET1: ${{ secrets.OSSRH_SECRET }}
        OSSRH_TOKEN1: ${{ secrets.OSSRH_TOKEN }}
        GPG_SECRET1: ${{ secrets.GPG_SECRET }}

    - name: Debug secrets availability
      run: |
        if [ -z "${OSSRH_SNAPSHOT_URL1}" ]; then echo "OSSRH_SNAPSHOT_URL1 is not set"; else echo "OSSRH_SNAPSHOT_URL1 is set"; fi
        if [ -z "${OSSRH_USER1}" ]; then echo "OSSRH_USER1 is not set"; else echo "OSSRH_USER1 is set"; fi
        if [ -z "${OSSRH_SECRET1}" ]; then echo "OSSRH_SECRET1 is not set"; else echo "OSSRH_SECRET1 is set"; fi
        if [ -z "${OSSRH_TOKEN1}" ]; then echo "OSSRH_TOKEN1 is not set"; else echo "OSSRH_TOKEN1 is set"; fi
        if [ -z "${GPG_SECRET1}" ]; then echo "GPG_SECRET1 is not set"; else echo "GPG_SECRET1 is set"; fi
      env:
        OSSRH_SNAPSHOT_URL1: ${{ secrets.OSSRH_SNAPSHOT_URL }}
        OSSRH_USER1: ${{ secrets.OSSRH_USER }}
        OSSRH_SECRET1: ${{ secrets.OSSRH_SECRET }}
        OSSRH_TOKEN1: ${{ secrets.OSSRH_TOKEN }}
        GPG_SECRET1: ${{ secrets.GPG_SECRET }}
