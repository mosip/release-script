name: Sandbox — approval gate for image transfer

# Safe test workflow for forks / personal repos.
# Does NOT call kattu / Crane / Docker Hub. Only proves:
#   TRANSFER_TARGET → Environment wait → Approve/Reject → secret unlock
#
# Use on: https://github.com/Ivanmeneges/release-script
# Setup: release/docs/image-transfer-sandbox-test.md

on:
  workflow_dispatch:
    inputs:
      TRANSFER_TARGET:
        description: 'Stage gate (must match a GitHub Environment name)'
        required: true
        type: choice
        default: 'transfer-dev2'
        options:
          - transfer-dev2
          - transfer-qa
      USERNAME:
        description: 'Dummy registry username (not used for real push)'
        required: true
        default: 'sandbox-user'
        type: string

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      DESTINATION_ORGANIZATION: ${{ steps.map.outputs.DESTINATION_ORGANIZATION }}
    steps:
      - name: Map TRANSFER_TARGET to destination organization
        id: map
        env:
          TARGET: ${{ inputs.TRANSFER_TARGET }}
        run: |
          case "$TARGET" in
            transfer-dev2) DEST="mosipdev2" ;;
            transfer-qa)   DEST="mosipqa" ;;
            *)
              printf 'Unknown TRANSFER_TARGET: %s\n' "$TARGET" >&2
              exit 1
              ;;
          esac
          printf 'Mapped %s → %s\n' "$TARGET" "$DEST"
          printf 'DESTINATION_ORGANIZATION=%s\n' "$DEST" >> "$GITHUB_OUTPUT"

  # Supported: environment on a normal runner job (not on a `uses:` job).
  gated-transfer:
    needs: resolve-target
    runs-on: ubuntu-latest
    environment: ${{ inputs.TRANSFER_TARGET }}
    steps:
      - name: Prove approval unlocked the Environment
        env:
          DEST: ${{ needs.resolve-target.outputs.DESTINATION_ORGANIZATION }}
          USER: ${{ inputs.USERNAME }}
          TOKEN_PRESENT: ${{ secrets.DOCKER_TOKEN != '' }}
          TARGET: ${{ inputs.TRANSFER_TARGET }}
        run: |
          printf '✅ Approver allowed this run\n'
          printf 'TRANSFER_TARGET=%s\n' "$TARGET"
          printf 'Derived destination org=%s\n' "$DEST"
          printf 'USERNAME=%s\n' "$USER"
          printf 'DOCKER_TOKEN present after approval=%s\n' "$TOKEN_PRESENT"
          if [ "$TOKEN_PRESENT" != "true" ]; then
            printf '❌ DOCKER_TOKEN missing on Environment %s\n' "$TARGET" >&2
            printf 'Add Environment secret DOCKER_TOKEN (dummy value is fine for sandbox)\n' >&2
            exit 1
          fi
          printf 'Sandbox OK — gate pattern matches image-transfer-with-approval.yml\n'
