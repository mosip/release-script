name:  workflow for mosip github releases

on:
  workflow_dispatch:
    inputs:
      ACTION_PAT:
        description: 'provide docker hub token'
        required: false
        default: ''
        type: string
jobs:
  chk_token:
    runs-on: ubuntu-latest
    outputs:
      ACTION_PAT: ${{ steps.ORG_TOKEN.outputs.ACTION_PAT }}
    steps:
      - name: Check if input ACTION_PAT is empty
        if: -n "${{  inputs.ACTION_PAT == ''  }}"
        id: ORG_TOKEN
        run: |
           echo "ACTION_PAT=ACTION_PAT" >> $GITHUB_OUTPUT
      - name: Print Secret Name
        run: |
          echo "SECRET NAME : ${{ steps.ORG_TOKEN.outputs.ACTION_PAT }}"
  workflow-tag:
    needs: chk_token
    uses: mosip/kattu/.github/workflows/tag.yaml@master
    secrets:
      ACTION_PAT: "${{ secrets[needs.chk_token.outputs.ACTION_PAT] || inputs.ACTION_PAT }}"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOSIP_WEBHOOK_URL }}
