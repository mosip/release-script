# Updated Workflow
name: Check Dockerfile in All Repositories of a GitHub User

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
      branch:
        description: 'Branch to check for Dockerfile'
        required: false # Optional to allow checking default branch

jobs:
  check-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get repositories for the GitHub user
        id: get-repos
        run: |
          USERNAME=${{ github.event.inputs.username }}
          BRANCH=${{ github.event.inputs.branch }}

          repos=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&page=1")

          echo "$repos" | jq -r '.[].full_name' > repos_list.txt
          echo "Dockerfile Check Results" > results.txt

          while IFS= read -r repo; do
            echo "Checking $repo..."

            response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$repo")

            default_branch=$(echo "$response" | jq -r '.default_branch')
            branch_to_check=${BRANCH:-$default_branch}

            tree_response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$repo/git/trees/$branch_to_check?recursive=1")

            if echo "$tree_response" | grep -q '"message": "Branch not found"'; then
              echo "$repo: Branch $branch_to_check NOT found." >> results.txt
              continue
            fi

            dockerfile_paths=$(echo "$tree_response" | jq -r '.tree[] | select(.path | test("(?i)Dockerfile")) | .path')

            if [[ -n "$dockerfile_paths" ]]; then
              for path in $dockerfile_paths; do
                echo "$repo: FOUND at $path" >> results.txt
              done
            else
              echo "$repo: NOT FOUND" >> results.txt
            fi
          done < repos_list.txt

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: dockerfile-check-results
          path: results.txt
