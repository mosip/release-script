name: Check Dockerfile in All Repositories of a GitHub User

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
      branch:
        description: 'Branch to check for Dockerfile'
        required: true

jobs:
  check-repos:
    runs-on: ubuntu-latest

    steps:
      # Install jq (for parsing JSON)
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Fetch all repositories of the GitHub user
      - name: Get repositories for the GitHub user
        id: get-repos
        run: |
          USERNAME=${{ github.event.inputs.username }}
          BRANCH=${{ github.event.inputs.branch }}

          # Fetch all repositories of the user with pagination handling
          page=1
          repos=()
          while : ; do
            # Fetch the current page of repositories
            response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/users/$USERNAME/repos?per_page=100&page=$page")

            # Parse the repo names and add to the repos list
            repo_names=$(echo "$response" | jq -r '.[].full_name')

            if [ -z "$repo_names" ]; then
              break  # No more repositories, exit the loop
            fi

            repos+=($repo_names)

            # Increment the page number to fetch the next page
            ((page++))
          done

          # Save all the repos to repos_list.txt
          printf "%s\n" "${repos[@]}" > repos_list.txt

          # Initialize results file with a header
          echo "Dockerfile Check Results for $USERNAME on Branch $BRANCH" > results.txt

          # Check each repository for Dockerfile
          for repo in "${repos[@]}"; do
            echo "Checking repository: $repo on branch: $BRANCH..."

            # Variables to track if Dockerfile is found in this repo
            page=1
            dockerfile_found_in_repo=false

            # Loop through all the pages (if the repo has too many files)
            while : ; do
              response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$repo/git/trees/$BRANCH?recursive=1&page=$page")

              # If no files are found, break the loop
              if [[ $(echo "$response" | jq '.tree | length') -eq 0 ]]; then
                break
              fi

              # Look for Dockerfile in the directories
              echo "$response" | jq -r '.tree[] | select(.path | test("Dockerfile")) | .path' | while read path; do
                if [ "$dockerfile_found_in_repo" = false ]; then
                  # Log the first Dockerfile found in this repo
                  echo "Dockerfile found in $repo at $path on branch: $BRANCH."
                  echo "$repo: FOUND at $path" >> results.txt
                  dockerfile_found_in_repo=true
                else
                  # If a Dockerfile is found in a new directory, log it
                  echo "Additional Dockerfile found in $repo at $path on branch: $BRANCH."
                  echo "$repo: FOUND at $path" >> results.txt
                fi
              done

              # If a Dockerfile has been found, break out of the pagination loop
              if [[ $dockerfile_found_in_repo == true ]]; then
                break
              fi

              # Continue to the next page if Dockerfile is not found yet
              ((page++))
            done

            # If no Dockerfile was found after checking all directories and pages, log it
            if [[ $dockerfile_found_in_repo == false ]]; then
              echo "Dockerfile NOT found in $repo on branch: $BRANCH."
              echo "$repo: NOT FOUND" >> results.txt
            fi

          done

      # Upload results to GitHub artifact
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: dockerfile-check-results
          path: results.txt
