name: Check Dockerfile in All Repositories of a GitHub User

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
      branch:
        description: 'Branch to check for Dockerfile'
        required: true

jobs:
  check-repos:
    runs-on: ubuntu-latest

    steps:
      # Install jq (for parsing JSON)
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Fetch all repositories of the GitHub user
      - name: Get repositories for the GitHub user
        id: get-repos
        run: |
          USERNAME=${{ github.event.inputs.username }}
          BRANCH=${{ github.event.inputs.branch }}
          
          # Fetch repositories of the user (with pagination for larger numbers of repos)
          response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&page=1")

          # Check if the response is valid JSON
          echo "$response" | jq empty
          if [ $? -ne 0 ]; then
            echo "Warning: Invalid JSON response for user $USERNAME. Skipping this request."
            continue  # Skip to next repository if invalid JSON
          fi

          # Check if the response contains repositories
          if echo "$response" | jq -e '. | length == 0' > /dev/null; then
            echo "Warning: No repositories found for user $USERNAME. Skipping."
            continue  # Skip to next repository if no repositories are found
          fi

          # Parse repository names and store them in a file
          echo "$response" | jq -r '.[].full_name' > repos_list.txt
          
          # Initialize results file with a header
          echo "Dockerfile Check Results for $USERNAME on Branch $BRANCH" > results.txt

          # Check each repository for Dockerfile
          while IFS= read -r repo; do
            echo "Checking repository: $repo on branch: $BRANCH..."
            dockerfile_found_in_repo=false
            branch_found=false
            page=1
            while : ; do
              # Get tree of the repo at the specified branch (limit to 3 levels of directories)
              repo_response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$repo/git/trees/$BRANCH?recursive=1&page=$page")
              
              # Check if the branch exists
              if echo "$repo_response" | grep -q '"message": "Branch not found"'; then
                echo "Warning: Branch $BRANCH NOT found in $repo. Skipping this repository."
                echo "$repo: Branch $BRANCH NOT found" >> results.txt
                branch_found=true
                break
              fi
              
              # If no files are found, break the loop
              if [[ $(echo "$repo_response" | jq '.tree | length') -eq 0 ]]; then
                break
              fi

              # Look for Dockerfile in the entire directory structure (recursive check)
              dockerfile_paths=$(echo "$repo_response" | jq -r '.tree[] | select(.path | test("/Dockerfile$")) | .path')

              if [[ -n "$dockerfile_paths" ]]; then
                for path in $dockerfile_paths; do
                  if [ "$dockerfile_found_in_repo" = false ]; then
                    echo "Dockerfile found in $repo at $path on branch: $BRANCH."
                    echo "$repo: FOUND at $path" >> results.txt
                    dockerfile_found_in_repo=true
                  else
                    echo "Additional Dockerfile found in $repo at $path on branch: $BRANCH."
                    echo "$repo: FOUND at $path" >> results.txt
                  fi
                done
                break
              fi

              # Check if more pages exist and increment the page counter
              ((page++))
            done

            # If no Dockerfile was found and branch was found, log it
            if [[ $dockerfile_found_in_repo == false && $branch_found == false ]]; then
              echo "Dockerfile NOT found in $repo on branch: $BRANCH."
              echo "$repo: NOT FOUND" >> results.txt
            fi
          done < repos_list.txt

      # Upload results to GitHub artifact
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: dockerfile-check-results
          path: results.txt
