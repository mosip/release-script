name: Check Dockerfile in All Repositories of a GitHub User

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
      branch:
        description: 'Branch to check for Dockerfile'
        required: true

jobs:
  check-repos:
    runs-on: ubuntu-latest

    steps:
      # Install jq (for parsing JSON)
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Fetch all repositories of the GitHub user
      - name: Get repositories for the GitHub user
        id: get-repos
        run: |
          USERNAME=${{ github.event.inputs.username }}
          BRANCH=${{ github.event.inputs.branch }}
          
          # Fetch repositories of the user (with pagination for larger numbers of repos)
          repos=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&page=1")
          
          # Parse repository names and store them in a file
          echo "$repos" | jq -r '.[].full_name' > repos_list.txt

          # Initialize results file with a header
          echo "Dockerfile Check Results for $USERNAME on Branch $BRANCH" > results.txt

          # Check for each repository if Dockerfile exists in any directory on the specified branch
          while IFS= read -r repo; do
            echo "Checking repository: $repo on branch: $BRANCH..."
            page=1
            dockerfile_found_in_repo=false

            # Loop through paginated files (to check all directories and subdirectories)
            while : ; do
              # Fetch the file tree recursively
              response=$(curl -s -H "Authorization: Bearer ${{ secrets.ACTION_PAT }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$repo/git/trees/$BRANCH?recursive=1&page=$page")

              # Check if the response is empty or null
              if [[ "$response" == "null" || -z "$response" ]]; then
                echo "No content found in $repo on branch $BRANCH."
                break
              fi

              # Check if the branch exists in the repo
              if echo "$response" | grep -q '"message": "Branch not found"'; then
                echo "Branch $BRANCH NOT found in $repo. Skipping to next repo."
                echo "$repo: Branch $BRANCH NOT found" >> results.txt
                break  # Skip to the next repository
              fi

              # Parse the tree of files and search for Dockerfile
              file_paths=$(echo "$response" | jq -r '.tree[] | select(.path | test("Dockerfile")) | .path')

              # If Dockerfile found in this repo, log the result
              if [[ -n "$file_paths" ]]; then
                if [ "$dockerfile_found_in_repo" = false ]; then
                  echo "Dockerfile(s) found in $repo at: $file_paths on branch: $BRANCH."
                  echo "$repo: FOUND at $file_paths" >> results.txt
                  dockerfile_found_in_repo=true
                else
                  # If more than one Dockerfile is found, log them
                  echo "Additional Dockerfile(s) found in $repo at: $file_paths on branch: $BRANCH."
                  echo "$repo: FOUND at $file_paths" >> results.txt
                fi
              fi

              # If no more files or directories are found, break out of the pagination loop
              if [[ $(echo "$response" | jq '.tree | length') -eq 0 ]]; then
                break
              fi

              # Continue to the next page if Dockerfile not found
              ((page++))
            done

            # If no Dockerfile was found in the entire repo
            if [ "$dockerfile_found_in_repo" = false ]; then
              echo "Dockerfile NOT found in $repo on branch: $BRANCH."
              echo "$repo: NOT FOUND" >> results.txt
            fi

          done < repos_list.txt

      # Upload results to GitHub artifact
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: dockerfile-check-results
          path: results.txt
