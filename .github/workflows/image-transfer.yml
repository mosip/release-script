name: Manual workflow to transfer images

on:
  workflow_dispatch:
    inputs:
      USERNAME:
        description: 'provide docker hub username'
        required: true
        default: ''
        type: string
      DESTINATION_ORGANIZATION:
        description: 'provide docker hub destination org'
        required: true
        default: ''
        type: string
      REGISTRY_URL:
        description: 'provide destination registry URL (http://harbor.example.com or https://registry.example.com)'
        required: true
        default: 'https://index.docker.io/v1/'
        type: string
      REGISTRY_TYPE:
        description: 'Select destination registry type'
        required: true
        default: 'dockerhub'
        type: choice
        options:
          - dockerhub
          - harbor
          - other
      ENABLE_WIREGUARD:
        description: 'Enable WireGuard VPN (required for private Harbor networks)'
        required: false
        default: false
        type: boolean

jobs:
  chk_token:
    runs-on: ubuntu-latest
    outputs:
      TOKEN: ${{ steps.ORG_TOKEN.outputs.TOKEN }}
    steps:
      - name: Set organization secrets dynamically
        id: ORG_TOKEN
        run: |
          ORG="${{ inputs.DESTINATION_ORGANIZATION }}"
          
          # Convert organization name to uppercase for secret name
          ORG_UPPER=$(echo "$ORG" | tr '[:lower:]' '[:upper:]')
          
          # Dynamically construct secret name based on organization
          TOKEN_SECRET="${ORG_UPPER}_DOCKER_TOKEN"
          
          echo "TOKEN=${TOKEN_SECRET}" >> $GITHUB_OUTPUT
      
      - name: Validate secret configuration
        env:
          TOKEN_EXISTS: ${{ secrets[steps.ORG_TOKEN.outputs.TOKEN] != '' }}
        run: |
          SECRET_NAME="${{ steps.ORG_TOKEN.outputs.TOKEN }}"
          
          if [ "$TOKEN_EXISTS" != "true" ]; then
            echo "❌ ERROR: Secret '$SECRET_NAME' is not configured or is empty"
            echo ""
            echo "Please configure the following secret in GitHub repository settings:"
            echo "  Secret name: $SECRET_NAME"
            echo "  Path: Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "For organization '${{ inputs.DESTINATION_ORGANIZATION }}', you need:"
            echo "  - Secret: $SECRET_NAME"
            echo "  - Value: Your Docker registry token/password"
            exit 1
          fi
          
          echo "✅ Secret '$SECRET_NAME' is configured"
  Image-transfer:
    needs: chk_token
    uses: mosip/kattu/.github/workflows/image-transfer.yml@master
    with:
      DESTINATION_ORGANIZATION: ${{ inputs.DESTINATION_ORGANIZATION }}
      REGISTRY_URL: ${{ inputs.REGISTRY_URL }}
      REGISTRY_TYPE: ${{ inputs.REGISTRY_TYPE }}
      ENABLE_WIREGUARD: ${{ inputs.ENABLE_WIREGUARD }}
      USERNAME: ${{ inputs.USERNAME }}
    secrets:
      TOKEN: "${{ secrets[needs.chk_token.outputs.TOKEN] }}"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEVOPS }}
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
